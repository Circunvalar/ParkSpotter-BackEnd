# Integración continua de ParkSpotter Backend (GitHub Actions: gratis e ilimitado en repositorios públicos).
#
# En cada push a master, develop o una rama Sprint-* y en cada pull request hacia master/develop:
#   1. pruebas: compila, ejecuta todas las pruebas (unitarias, integración con H2, API, rendimiento)
#      y exige la cobertura mínima de JaCoCo (./mvnw verify). Publica un resumen y los reportes.
#   2. e2e: levanta la API contra un PostgreSQL 18 real (contenedor efímero) y ejecuta el smoke test
#      de punta a punta (scripts/smoke-test.sh).
# Ninguno de los dos jobs se conecta a la base de datos de producción.

name: CI - Pruebas automatizadas

on:
  push:
    branches: [master, develop, 'Sprint-**']
  pull_request:
    branches: [master, develop]
  workflow_dispatch:

# Si llega un push nuevo a la misma rama, se cancela la ejecución anterior.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  pruebas:
    name: Pruebas y cobertura
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Descargar el código
        uses: actions/checkout@v7

      - name: Instalar Java 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Compilar, probar y verificar cobertura (mvn verify)
        run: ./mvnw -B verify

      - name: Resumen de pruebas y cobertura
        if: always()
        run: python3 scripts/ci-summary.py >> "$GITHUB_STEP_SUMMARY"

      - name: Guardar reportes de pruebas y cobertura
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: reportes-pruebas
          path: |
            target/site/jacoco/
            target/surefire-reports/
          retention-days: 14

      - name: Guardar el jar para la prueba de punta a punta
        uses: actions/upload-artifact@v7
        with:
          name: app-jar
          path: target/BackendParkSpotter-0.0.1-SNAPSHOT.jar
          retention-days: 1

  e2e:
    name: Punta a punta con PostgreSQL
    needs: pruebas
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_DB: parkspotter_ci
          POSTGRES_USER: parkspotter
          # Solo existe dentro de este contenedor temporal de la CI; no es una credencial real.
          POSTGRES_PASSWORD: parkspotter_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U parkspotter -d parkspotter_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    steps:
      - name: Descargar el código
        uses: actions/checkout@v7

      - name: Instalar Java 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'

      - name: Obtener el jar compilado en el job de pruebas
        uses: actions/download-artifact@v8
        with:
          name: app-jar
          path: target

      - name: Levantar la API y ejecutar el smoke test
        env:
          SPRING_DATASOURCE_URL: jdbc:postgresql://localhost:5432/parkspotter_ci
          SPRING_DATASOURCE_USERNAME: parkspotter
          SPRING_DATASOURCE_PASSWORD: parkspotter_ci
          APP_BOOTSTRAP_ROLES: 'true'
          PORT: '8080'
        run: |
          # Secreto JWT aleatorio por ejecución (nunca el de producción)
          export JWT_SECRET="$(openssl rand -hex 48)"
          bash scripts/e2e.sh

      - name: Guardar el log de la API
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: log-api-e2e
          path: target/e2e-app.log
          retention-days: 7
