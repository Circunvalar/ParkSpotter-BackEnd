# Integración continua de ParkSpotter Backend (GitHub Actions: gratis e ilimitado en repositorios públicos).
#
# En cada push a master, develop o una rama Sprint-* y en cada pull request hacia master/develop:
#   1. pruebas: compila, ejecuta todas las pruebas (unitarias, integración con H2, API, rendimiento)
#      y exige la cobertura mínima de JaCoCo (./mvnw verify). Publica un resumen y los reportes.
#   2. e2e: levanta la API contra un SQL Server 2022 real (contenedor efímero, el mismo motor que
#      Azure SQL) y ejecuta el smoke test de punta a punta (scripts/smoke-test.sh).
# Ninguno de los dos jobs se conecta a la base de datos de producción.

name: CI - Pruebas automatizadas

on:
  push:
    branches: [master, develop, 'Sprint-**']
  pull_request:
    branches: [master, develop]
  workflow_dispatch:

# Si llega un push nuevo a la misma rama, se cancela la ejecución anterior.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  pruebas:
    name: Pruebas y cobertura
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Descargar el código
        uses: actions/checkout@v7

      - name: Instalar Java 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Compilar, probar y verificar cobertura (mvn verify)
        run: ./mvnw -B verify

      - name: Resumen de pruebas y cobertura
        if: always()
        run: python3 scripts/ci-summary.py >> "$GITHUB_STEP_SUMMARY"

      - name: Guardar reportes de pruebas y cobertura
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: reportes-pruebas
          path: |
            target/site/jacoco/
            target/surefire-reports/
          retention-days: 14

      - name: Guardar el jar para la prueba de punta a punta
        uses: actions/upload-artifact@v7
        with:
          name: app-jar
          path: target/BackendParkSpotter-0.0.1-SNAPSHOT.jar
          retention-days: 1

  e2e:
    name: Punta a punta con SQL Server
    needs: pruebas
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Descargar el código
        uses: actions/checkout@v7

      - name: Instalar Java 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'

      - name: Obtener el jar compilado en el job de pruebas
        uses: actions/download-artifact@v8
        with:
          name: app-jar
          path: target

      - name: Levantar SQL Server 2022 y crear la base de pruebas
        # Contenedor temporal con una contraseña aleatoria por ejecución (nada fijo en el repo).
        run: |
          SA_PASSWORD="Ci-$(openssl rand -hex 16)"
          echo "::add-mask::$SA_PASSWORD"
          echo "SPRING_DATASOURCE_PASSWORD=$SA_PASSWORD" >> "$GITHUB_ENV"
          docker run -d --name mssql -e ACCEPT_EULA=Y -e "MSSQL_SA_PASSWORD=$SA_PASSWORD" -p 1433:1433 \
            mcr.microsoft.com/mssql/server:2022-latest
          for i in $(seq 1 60); do
            if docker exec mssql /opt/mssql-tools18/bin/sqlcmd -C -S localhost -U sa -P "$SA_PASSWORD" -b \
                -Q "CREATE DATABASE parkspotter_ci" > /dev/null 2>&1; then
              echo "SQL Server listo."; exit 0
            fi
            sleep 3
          done
          echo "SQL Server no arrancó a tiempo." >&2
          docker logs mssql | tail -n 40 >&2
          exit 1

      - name: Levantar la API y ejecutar el smoke test
        env:
          SPRING_DATASOURCE_URL: jdbc:sqlserver://localhost:1433;database=parkspotter_ci;encrypt=true;trustServerCertificate=true
          SPRING_DATASOURCE_USERNAME: sa
          APP_BOOTSTRAP_ROLES: 'true'
          PORT: '8080'
        run: |
          # Secreto JWT aleatorio por ejecución (nunca el de producción)
          export JWT_SECRET="$(openssl rand -hex 48)"
          bash scripts/e2e.sh

      - name: Guardar el log de la API
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: log-api-e2e
          path: target/e2e-app.log
          retention-days: 7
