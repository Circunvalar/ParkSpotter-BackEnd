# Publicación de la imagen Docker del backend (ver docs/Despliegue-Gratuito.md).
#
# Cuando la CI termina bien en master (o a mano con "Run workflow"):
#   1. imagen: construye la imagen y la publica en GitHub Container Registry como
#      ghcr.io/circunvalar/parkspotter-backend:latest y :sha-<commit>. Sirve para Cloud Run, Koyeb
#      o cualquier hosting de contenedores.
#   2. render: si existe el secreto RENDER_DEPLOY_HOOK_URL, le pide a Render que despliegue el commit.
#      No hace falta si el servicio de Render ya tiene "Auto-Deploy: After CI checks pass" (render.yaml).
# Los secretos de la app (DB_PASSWORD, JWT_SECRET, ...) viven en el panel del hosting, no aquí.

name: Despliegue - Imagen y Render

on:
  workflow_run:
    workflows: ['CI - Pruebas automatizadas']
    types: [completed]
    branches: [master]
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

env:
  IMAGE: ghcr.io/circunvalar/parkspotter-backend
  COMMIT: ${{ github.event.workflow_run.head_sha || github.sha }}

jobs:
  imagen:
    name: Publicar imagen en GHCR
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Descargar el código probado
        uses: actions/checkout@v7
        with:
          ref: ${{ env.COMMIT }}

      - name: Preparar Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Iniciar sesión en GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Construir y publicar (linux/amd64)
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: |
            ${{ env.IMAGE }}:latest
            ${{ env.IMAGE }}:sha-${{ env.COMMIT }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  render:
    name: Desplegar en Render (opcional)
    needs: imagen
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      HOOK: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
    steps:
      - name: Llamar al deploy hook
        if: env.HOOK != ''
        run: curl -fsS -X POST "$HOOK" > /dev/null && echo "Render recibió la orden de desplegar la rama master."
      - name: Sin deploy hook
        if: env.HOOK == ''
        run: echo "RENDER_DEPLOY_HOOK_URL no está configurado; Render despliega solo con su Auto-Deploy."
