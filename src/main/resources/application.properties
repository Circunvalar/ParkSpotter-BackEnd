spring.application.name=BackendParkSpotter

# Base de datos: Azure SQL (SQL Server). La contraseña NUNCA va en este archivo: se lee de la
# variable de entorno DB_PASSWORD (sin ella la app no arranca). DB_URL y DB_USERNAME son opcionales.
spring.datasource.url=${DB_URL:jdbc:sqlserver://parkspotter.database.windows.net:1433;database=ParkSpotterDatabase;encrypt=true;trustServerCertificate=false;hostNameInCertificate=*.database.windows.net;loginTimeout=30}
spring.datasource.username=${DB_USERNAME:ParkSpotterDatabaseManager@parkspotter}
spring.datasource.password=${DB_PASSWORD}
# Sin esto el driver de SQL Server manda las horas (LocalTime) como datetime y no se pueden comparar
# con las columnas time del horario de los garajes (búsqueda "abierto ahora"). Aplica aunque cambie DB_URL.
spring.datasource.hikari.data-source-properties.sendTimeAsDatetime=false

spring.datasource.hikari.pool-name=HikariPool
spring.datasource.hikari.maximum-pool-size=20
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.idle-timeout=300000
spring.datasource.hikari.max-lifetime=1800000

# Hibernate detecta el dialecto (SQL Server, PostgreSQL o H2) y el driver por la URL; especificarlos está obsoleto.
# open-in-view=false: cada petición suelta su conexión al terminar la transacción. Con el valor por
# defecto (true) cada stream SSE retenía una conexión del pool mientras estaba abierto y con ~20
# clientes conectados el resto de la API se quedaba sin conexiones (500 tras 30 s).
spring.jpa.open-in-view=false
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.properties.hibernate.jdbc.lob.non_contextual_creation=true

server.port=8080

app.cors.allowed-origins=http://localhost:3000,http://localhost:8081,https://frontend.example.com
app.jwt.issuer=backend-park-spotter
app.jwt.audience=backend-park-spotter-api
app.jwt.secret=${JWT_SECRET:change-this-secret-in-production-change-this-secret-in-production-change-this-secret}
app.jwt.access-token-ttl=PT15M
app.jwt.refresh-token-ttl=P7D
app.security.max-login-attempts=5
app.security.lockout-duration=PT15M
app.security.login-window=PT10M
app.bootstrap.roles=false

# Garajes: zona horaria para "abierto ahora", generación de plazas para garajes antiguos y stream en tiempo real (SSE)
app.garages.time-zone=America/Bogota
app.garages.backfill-spots=true
app.garages.stream-timeout=PT30M
app.garages.stream-heartbeat=PT25S
app.garages.stream-max-subscribers=1000

# Mensajes de validación siempre en español, sin importar el idioma del servidor o del cliente
spring.web.locale=es
spring.web.locale-resolver=fixed

# ---------- Sprint 04-06 ----------

# Roles: otorga ROLE_ADMIN a esta cuenta al arrancar (si existe). Las cuentas antiguas reciben rol de conductor o propietario.
app.bootstrap.admin-email=${ADMIN_EMAIL:}
app.bootstrap.legacy-roles=true

# Reservas: duración, anticipación, tiempo para pagar, cuándo se aparta la plaza y tareas automáticas
app.reservations.min-duration=PT30M
app.reservations.max-duration=PT24H
app.reservations.max-advance=P30D
app.reservations.payment-timeout=PT15M
app.reservations.hold-before-start=PT30M
app.reservations.check-in-early=PT30M
app.reservations.scheduler-enabled=true
app.reservations.scheduler-interval=PT1M

# Pagos: "sandbox" (simulado) o "wompi" (llaves de prueba pub_test/prv_test en el panel de Wompi)
app.payments.provider=${PAYMENTS_PROVIDER:sandbox}
app.payments.wompi.public-key=${WOMPI_PUBLIC_KEY:}
app.payments.wompi.integrity-secret=${WOMPI_INTEGRITY_SECRET:}
app.payments.wompi.events-secret=${WOMPI_EVENTS_SECRET:}
app.payments.allowed-redirect-prefixes=${PAYMENTS_REDIRECT_PREFIXES:http://localhost:3000/,parkspotter://}
app.payments.default-redirect-url=${PAYMENTS_DEFAULT_REDIRECT:http://localhost:3000/pagos/resultado}

# Correo (recuperación de contraseña y notificaciones). Sin SMTP los correos solo se registran en el log.
app.mail.enabled=${MAIL_ENABLED:false}
app.mail.from=${MAIL_FROM:ParkSpotter <no-reply@parkspotter.co>}
spring.mail.host=${MAIL_HOST:}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
app.security.password-reset-ttl=PT30M
app.frontend.reset-password-url=${RESET_PASSWORD_URL:http://localhost:3000/restablecer-contrasena}

# Push con Firebase Cloud Messaging (cuenta de servicio del proyecto de Firebase)
app.push.fcm.enabled=${FCM_ENABLED:false}
app.push.fcm.project-id=${FCM_PROJECT_ID:}
app.push.fcm.client-email=${FCM_CLIENT_EMAIL:}
app.push.fcm.private-key=${FCM_PRIVATE_KEY:}

# Fotos de garajes
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=6MB

# Swagger
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/v3/api-docs
