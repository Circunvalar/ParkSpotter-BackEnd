spring.application.name=BackendParkSpotter

spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/ParkSpotterdb}
spring.datasource.username=${DB_USERNAME:park_user}
spring.datasource.password=${DB_PASSWORD:NuevaPasswordFuerte123!}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.datasource.hikari.pool-name=HikariPool
spring.datasource.hikari.maximum-pool-size=20
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.idle-timeout=300000
spring.datasource.hikari.max-lifetime=1800000

spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.properties.hibernate.jdbc.lob.non_contextual_creation=true

server.port=8080

app.cors.allowed-origins=http://localhost:3000,http://localhost:8081,https://frontend.example.com
app.jwt.issuer=backend-park-spotter
app.jwt.audience=backend-park-spotter-api
app.jwt.secret=${JWT_SECRET:change-this-secret-in-production-change-this-secret-in-production-change-this-secret}
app.jwt.access-token-ttl=PT15M
app.jwt.refresh-token-ttl=PT7D
app.security.max-login-attempts=5
app.security.lockout-duration=PT15M
app.security.login-window=PT10M
app.bootstrap.roles=false
