spring.application.name=BackendParkSpotter
# Conexión a PostgreSQL local
spring.datasource.url=jdbc:postgresql://localhost:5432/parkspottercentraldb
spring.datasource.username=park_user
# Por seguridad es mejor poner la contraseña en una variable de entorno DB_PASSWORD.
# Si no la defines, se usará la contraseña por defecto indicada aquí.
spring.datasource.password=${DB_PASSWORD:A9k3Tz8Qw4Bj1V7sY2pL}
spring.datasource.driver-class-name=org.postgresql.Driver

# HikariCP (connection pool)
spring.datasource.hikari.pool-name=HikariPool
spring.datasource.hikari.maximum-pool-size=20
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.idle-timeout=300000
spring.datasource.hikari.max-lifetime=1800000
spring.datasource.hikari.leak-detection-threshold=15000

# JPA / Hibernate
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
# Para desarrollo/arranque rápido puedes usar 'update'. En producción cambia a 'validate' o gestiona migrations (Flyway/Liquibase).
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.properties.hibernate.jdbc.lob.non_contextual_creation=true

# Timeouts y parámetros útiles

server.port=8080
spring.datasource.test-on-borrow=true