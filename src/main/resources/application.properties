spring.application.name=BackendParkSpotter

spring.datasource.url=jdbc:postgresql://dpg-damuoeegekts73f2flo0-a.oregon-postgres.render.com:5432/parkspotterdatabase
spring.datasource.username=parkuserdatauserbase
spring.datasource.password=W7nM0Al3zseZ8NJ1J0dIyTlLg1cmM7Rr
spring.datasource.driver-class-name=org.postgresql.Driver

spring.datasource.hikari.pool-name=HikariPool
spring.datasource.hikari.maximum-pool-size=20
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.idle-timeout=300000
spring.datasource.hikari.max-lifetime=1800000

# Hibernate detecta el dialecto de PostgreSQL solo (especificarlo está obsoleto).
# open-in-view=false: cada petición suelta su conexión al terminar la transacción. Con el valor por
# defecto (true) cada stream SSE retenía una conexión del pool mientras estaba abierto y con ~20
# clientes conectados el resto de la API se quedaba sin conexiones (500 tras 30 s).
spring.jpa.open-in-view=false
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.properties.hibernate.jdbc.lob.non_contextual_creation=true

server.port=8080

app.cors.allowed-origins=http://localhost:3000,http://localhost:8081,https://frontend.example.com
app.jwt.issuer=backend-park-spotter
app.jwt.audience=backend-park-spotter-api
app.jwt.secret=${JWT_SECRET:change-this-secret-in-production-change-this-secret-in-production-change-this-secret}
app.jwt.access-token-ttl=PT15M
app.jwt.refresh-token-ttl=P7D
app.security.max-login-attempts=5
app.security.lockout-duration=PT15M
app.security.login-window=PT10M
app.bootstrap.roles=false

# Garajes: zona horaria para "abierto ahora", generación de plazas para garajes antiguos y stream en tiempo real (SSE)
app.garages.time-zone=America/Bogota
app.garages.backfill-spots=true
app.garages.stream-timeout=PT30M
app.garages.stream-heartbeat=PT25S
app.garages.stream-max-subscribers=1000

# Mensajes de validación siempre en español, sin importar el idioma del servidor o del cliente
spring.web.locale=es
spring.web.locale-resolver=fixed
