spring.datasource.url=jdbc:h2:mem:parkspotter_test;MODE=PostgreSQL;DB_CLOSE_DELAY=-1;DATABASE_TO_LOWER=TRUE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.main.allow-bean-definition-overriding=true
app.bootstrap.roles=false
app.cors.allowed-origins=http://localhost:3000
app.jwt.issuer=backend-park-spotter
app.jwt.audience=backend-park-spotter-api
app.jwt.secret=change-this-secret-in-production-change-this-secret-in-production-change-this-secret
app.jwt.access-token-ttl=PT15M
app.jwt.refresh-token-ttl=P7D
app.security.max-login-attempts=5
app.security.lockout-duration=PT15M
app.security.login-window=PT10M
